# What this repository publishes: the ESPC currents, and nothing else.
#
# **The Navy scalar fields are `espc-model-fields-repo`'s, since 2026-08-31.**
# They stayed in `realtime-data-repo` from 2026-08-22 on the owner's call,
# after the storage was measured rather than estimated — the projection then:
# ~88 MB per tiled u/v frame, 528 MB for the three depth-averaged layers,
# ~969 MB with sst and sss against a 1 GB Pages limit, ~880 MB without them.
# They could never come here; the currents-and-fields split gave them a
# repository of their own instead, and this one keeps the currents alone.
#
# **Re-measured 2026-08-28 from the pipeline's own byte log, and the call
# stands.** A frame is 71-78 MB rather than 88, the caps are 433.6 MB rather
# than 528, and the whole tier is 738.7 MB over ten sets — two leads each for
# surface, 50 m and the three caps. With 93 MB of grids that is 832 MB, 81%
# of the cap. Adding ssh (no tile tier at all), the ice (57.6 MB), sst
# (44.0) and sss (45.1) lands at ~982 MB: 96%, about 42 MB spare, which is
# less than one frame. So the projection was right and slightly optimistic,
# and nothing about the machinery is what blocks the move.
#
# The headroom, if it is wanted, is the SECOND LEAD rather than the tiles'
# resolution: one lead per depth halves the tier and puts all four Navy
# products near 613 MB. That reopens "two frames per window", which is the
# owner's call and not this file's.
#
# It also gives this repository one subject rather than two: the currents at
# every depth the model offers, from one model, in one place.
#
# The ESPC currents moved here from `realtime-data-repo` on 2026-08-22 — the
# surface and 50 m and, later, the three depth-averaged caps. **The Navy
# temperature and salinity did NOT come with them**, on storage, and the ice
# stayed behind deliberately as a live test that moving one product between
# repositories is cheap.
#
# **That test was cashed on 2026-08-31**: all five scalars went to
# `espc-model-fields-repo`, and the consumer's side of it was one line in the
# site's `MAP_ORIGINS`.
#
# Two rules this file has to satisfy, both learned in the other repository:
#
# - **Every `roots` entry here must be one the site's `test-schema.mjs
#   --roots` publishes.** The orchestrator exits 2 on a root declared here
#   that the contract does not know, and stops the publish. It does *not*
#   fail on the reverse — a contract root this repository has no product for
#   is the ordinary case now, because `realtime-data-repo` owns most of them.
#   The union across origins is held by `check:docs` on the site, which is
#   the only side that can see every declaration at once.
# - **A product that leaves takes its files with it.** The stage is seeded
#   from the last publish, so a root a pipeline stops writing is carried
#   forward for ever — 32 files and 43.8 MB the last time a layer moved. A
#   product declares a `namespace` command so the orchestrator can say what is
#   no longer named.

# **The paths are relative to the site checkout, not to this workspace.** The
# orchestrator runs both of these with the site checkout as their working
# directory, so `site/scripts/...` would have looked right and resolved to
# nothing. Corrected before the first run that would have met it.
[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

# The currents fetch is the long one here, and 30 is what it gets in the
# repository it is moving from. A shorter default would have changed a
# product's behaviour as a side effect of moving it, which is the one thing a
# move must not do.
[defaults]
timeout_minutes = 30

# --- steps -------------------------------------------------------------------
# `lane` names the upstream a step leans on. Steps in different lanes run
# concurrently; steps in the same lane queue, because two HYCOM reads competing
# for the same THREDDS server help nobody, least of all HYCOM.
#
# Both steps are one lane for that reason — and note the split makes it two
# *repositories* reading HYCOM now, which no lane can serialize. That is what
# the offset crons in the workflow are for.
#
# **No step is marked `light`, and no light run is scheduled.** A light run
# exists to refresh the fast products three times an hour — storms, gliders,
# buoys — and this repository has none: ESPC publishes hourly at best and this
# pipeline snaps its step to a six-hour boundary. A light cron here would spin
# a runner twice an hour to fetch nothing.

[steps.currents]
cmd = ["python3", "scripts/fetch-currents.py"]
lane = "hycom"

# **Three products, one per upstream READ — the 2026-08-26 lesson.** This
# was one product ("they are one fetch and one hour... they share a fate"),
# and the day the quality gate landed showed the fate boundary was drawn in
# the wrong place: HYCOM corrupted the z=14 read and the profile read while
# the z=0 read stayed clean, so a per-product hold would have held a correct,
# operationally critical surface hostage to the broken depths. Failures are
# per read, so fates are per read:
#
#   currents-surface  the z=0 level read
#   currents-50m      the z=14 level read
#   currents-caps     the ONE shared profile read the three averages share
#
# The caps stay one product deliberately: they are averages of the same
# profile fetch, cannot fail independently (all three corrupted together),
# and splitting them would triple the profile reads their shared fetch
# exists to avoid. Still one STEP — the fetch is shared; only the fates,
# namespaces, tiles and quality verdicts split. The `writes` globs mirror
# `DOMAINS` in fetch-currents.py; a file matching no product is a fence
# failure, which is the loud shape a new region or depth fails in until
# both sides learn it. The `-vbar1d` files are each layer's running daily
# mean — the quality gate's reference, folded only from accepted base
# fields and published with the product so a hold restores it too.
[products.currents-surface]
title = "Currents at the surface (ESPC)"
step = "currents"
roots = ["currents.json"]
writes = [
  "currents.json", "currents-f*h.json", "currents-vbar1d.json",
  "currents-atlantic.json", "currents-atlantic-f*h.json", "currents-atlantic-vbar1d.json",
  "currents-arctic.json", "currents-arctic-f*h.json", "currents-arctic-vbar1d.json",
  "currents-antarctic.json", "currents-antarctic-f*h.json", "currents-antarctic-vbar1d.json",
]
# Two, not nine. The anchor publishes frames that BRACKET the
# reader (REFRESH_HOURS in fetch-currents.py is the model's own
# 3-hour step), so the nearest frame is at most 1.5 h away by
# construction. Nine could not have caught anything: it was six
# times the owner's stated bar, and it measured the wrong
# quantity besides.
max_age_hours = 2
namespace = ["python3", "scripts/fetch-currents.py", "--namespace", "--only=surface"]
quality = ["python3", "scripts/fetch-currents.py", "--quality", "--only=surface"]

[products.currents-surface.tiles]
build = ["python3", "scripts/fetch-currents.py", "--tiles", "--only=surface"]
key = ["python3", "scripts/fetch-currents.py", "--tile-key"]
cache = "currents-tiles-surface"
match = [
  ["tiles", "currents.json"],
  ["tiles-f*h", "currents-f*h.json"],
]

[products.currents-50m]
title = "Currents at 50 m (ESPC)"
step = "currents"
roots = ["currents-50m.json"]
writes = ["currents*-50m*.json"]
# Two, not nine. The anchor publishes frames that BRACKET the
# reader (REFRESH_HOURS in fetch-currents.py is the model's own
# 3-hour step), so the nearest frame is at most 1.5 h away by
# construction. Nine could not have caught anything: it was six
# times the owner's stated bar, and it measured the wrong
# quantity besides.
max_age_hours = 2
namespace = ["python3", "scripts/fetch-currents.py", "--namespace", "--only=50m"]
quality = ["python3", "scripts/fetch-currents.py", "--quality", "--only=50m"]

[products.currents-50m.tiles]
build = ["python3", "scripts/fetch-currents.py", "--tiles", "--only=50m"]
key = ["python3", "scripts/fetch-currents.py", "--tile-key"]
cache = "currents-tiles-50m"
match = [
  ["tiles-50m", "currents-50m.json"],
  ["tiles-50m-f*h", "currents-50m-f*h.json"],
]

[products.currents-caps]
title = "Currents averaged to 200, 350 and 1000 m (ESPC)"
step = "currents"
roots = [
  "currents-avg200m.json", "currents-avg350m.json", "currents-avg1000m.json",
]
writes = ["currents*-avg*.json"]
# Two, not nine. The anchor publishes frames that BRACKET the
# reader (REFRESH_HOURS in fetch-currents.py is the model's own
# 3-hour step), so the nearest frame is at most 1.5 h away by
# construction. Nine could not have caught anything: it was six
# times the owner's stated bar, and it measured the wrong
# quantity besides.
max_age_hours = 2
namespace = ["python3", "scripts/fetch-currents.py", "--namespace", "--only=caps"]
quality = ["python3", "scripts/fetch-currents.py", "--quality", "--only=caps"]

[products.currents-caps.tiles]
build = ["python3", "scripts/fetch-currents.py", "--tiles", "--only=caps"]
key = ["python3", "scripts/fetch-currents.py", "--tile-key"]
cache = "currents-tiles-caps"
match = [
  ["tiles-avg200m", "currents-avg200m.json"],
  ["tiles-avg350m", "currents-avg350m.json"],
  ["tiles-avg1000m", "currents-avg1000m.json"],
  ["tiles-avg200m-f*h", "currents-avg200m-f*h.json"],
  ["tiles-avg350m-f*h", "currents-avg350m-f*h.json"],
  ["tiles-avg1000m-f*h", "currents-avg1000m-f*h.json"],
]
