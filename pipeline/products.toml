# What this repository publishes: the ESPC currents, and nothing else.
#
# **The Navy temperature and salinity stay in `realtime-data-repo`**, the
# owner's call on 2026-08-22, after the storage was measured rather than
# estimated. A tiled u/v product is about 88 MB per frame; the three
# depth-averaged current layers planned here are 528 MB of tiles between
# them, and with sst and sss as well this repository came to ~969 MB against
# a 1 GB Pages limit. Without them it is ~880 MB, which is still tight and is
# why whether those layers need full 1/12 deg tiles is still open.
#
# It also gives this repository one subject rather than two: the currents at
# every depth the model offers, from one model, in one place.
#
# The ESPC products move here from `realtime-data-repo` as part of the split
# — the currents at the surface and 50 m, and the Navy temperature and
# salinity — while the **ice stays behind**, deliberately, as a live test that
# moving one product between repositories is cheap.
#
# Two rules this file has to satisfy, both learned in the other repository:
#
# - **Every `roots` entry here must be one the site's `test-schema.mjs
#   --roots` publishes.** The orchestrator exits 2 on a root declared here
#   that the contract does not know, and stops the publish. It does *not*
#   fail on the reverse — a contract root this repository has no product for
#   is the ordinary case now, because `realtime-data-repo` owns most of them.
#   The union across origins is held by `check:docs` on the site, which is
#   the only side that can see every declaration at once.
# - **A product that leaves takes its files with it.** The stage is seeded
#   from the last publish, so a root a pipeline stops writing is carried
#   forward for ever — 32 files and 43.8 MB the last time a layer moved. A
#   product declares a `namespace` command so the orchestrator can say what is
#   no longer named.

# **The paths are relative to the site checkout, not to this workspace.** The
# orchestrator runs both of these with the site checkout as their working
# directory, so `site/scripts/...` would have looked right and resolved to
# nothing. Corrected before the first run that would have met it.
[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

# The currents fetch is the long one here, and 30 is what it gets in the
# repository it is moving from. A shorter default would have changed a
# product's behaviour as a side effect of moving it, which is the one thing a
# move must not do.
[defaults]
timeout_minutes = 30

# --- steps -------------------------------------------------------------------
# `lane` names the upstream a step leans on. Steps in different lanes run
# concurrently; steps in the same lane queue, because two HYCOM reads competing
# for the same THREDDS server help nobody, least of all HYCOM.
#
# Both steps are one lane for that reason — and note the split makes it two
# *repositories* reading HYCOM now, which no lane can serialize. That is what
# the offset crons in the workflow are for.
#
# **No step is marked `light`, and no light run is scheduled.** A light run
# exists to refresh the fast products three times an hour — storms, gliders,
# buoys — and this repository has none: ESPC publishes hourly at best and this
# pipeline snaps its step to a six-hour boundary. A light cron here would spin
# a runner twice an hour to fetch nothing.

[steps.currents]
cmd = ["python3", "scripts/fetch-currents.py"]
lane = "hycom"

[products.currents]
title = "Surface and 50 m currents (ESPC)"
step = "currents"
roots = ["currents.json", "currents-50m.json"]
writes = ["currents*.json"]
max_age_hours = 9
namespace = ["python3", "scripts/fetch-currents.py", "--namespace"]

[products.currents.tiles]
build = ["python3", "scripts/fetch-currents.py", "--tiles"]
key = ["python3", "scripts/fetch-currents.py", "--tile-key"]
cache = "currents-tiles"
# Each tile directory belongs to one grid, and must be its hour. A `*` in the
# directory carries into the grid name — the forecast frames are named for
# their lead, and the lead moves with the run's lateness.
match = [
  ["tiles", "currents.json"],
  ["tiles-50m", "currents-50m.json"],
  ["tiles-f*h", "currents-f*h.json"],
  ["tiles-50m-f*h", "currents-50m-f*h.json"],
]
